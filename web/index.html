<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- iPhone: full-screen when added to the Home Screen, notch-aware. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEE500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Multivo">
<meta name="description" content="Multivo — chat in your language, read in theirs. iPhone web version.">
<title>Multivo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* KakaoTalk-style light theme: Kakao yellow, white chat, dark ink text.
   The variable names below are the old plum names kept so app.js inline
   styles (which reference them) keep working — only the values changed. */
:root {
  --plum-950: #FFFFFF; --plum-900: #F7F7F7; --plum-850: #F2F2F2;
  --plum-800: #FFFFFF; --plum-700: #F0F0F0;
  --violet-300: #191919; --violet-400: #3C1E1E; --violet-500: #FEE500;
  --orchid: #FEE500; --pink: #FF5B5B;
  --lavender: #191919; --lavender-muted: #8A8A8A;
  --online: #00A84F; --error: #D92D20; --outline: #E5E5E5;
  --accent: #FEE500;
  --tab-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px; line-height: 1.45; color: var(--lavender);
  background: #FFFFFF; min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0; }
a { color: var(--violet-300); }
button { font: inherit; cursor: pointer; }
input, select, textarea {
  font: inherit; color: var(--lavender); background: var(--plum-800);
  border: 1px solid var(--outline); border-radius: 12px;
  padding: 12px 14px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--violet-400); outline-offset: 1px; }
label { display: block; font-size: 14px; color: var(--lavender-muted); margin: 14px 0 6px; }
small { color: var(--lavender-muted); font-size: 13px; line-height: 1.5; display: block; }

/* Layout: one phone-width column, safe areas for the notch / home bar. */
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom)); }
main.no-tabs { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.view { display: none; }
.view.active { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.brand { text-align: center; padding: 28px 0 8px; }
.brand .logo {
  width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 22px;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: bold; color: #191919;
}
.brand h1 { font-size: 32px; }
.brand p { color: var(--lavender-muted); margin: 6px 0 0; }
.card {
  background: #FFFFFF;
  border: 1px solid #EDEDED; border-radius: 20px; padding: 18px; margin-top: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.card h2 { font-size: 22px; margin-bottom: 4px; }

.btn {
  display: block; width: 100%; padding: 14px; margin-top: 16px;
  border: none; border-radius: 16px; background: var(--accent);
  color: #191919; font-weight: 700; font-size: 16px;
}
.btn.secondary { background: var(--plum-700); color: var(--lavender); border: 1px solid var(--outline); }
.btn.ghost { background: transparent; color: var(--violet-300); border: none; padding: 10px; margin-top: 8px; }
.btn.small { width: auto; display: inline-block; padding: 8px 14px; margin: 0; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: wait; }

.error {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px;
  background: #FFF0F0; border: 1px solid #FFB3B3; color: #D92D20; font-size: 14px;
}
.error.show { display: block; }
.note {
  margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px;
  background: #F7F7F7; border: 1px solid var(--outline); color: var(--lavender-muted);
}
.demo-banner {
  margin-top: 12px; padding: 10px 14px; border-radius: 12px; text-align: center;
  background: #FFFBE5;
  border: 1px solid var(--orchid); font-size: 14px; font-weight: 600;
}
.demo-banner small { color: var(--lavender-muted); }
.pill {
  display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
  background: var(--plum-700); color: var(--violet-300); margin-left: 6px; vertical-align: middle;
}
.dot { width: 10px; height: 10px; border-radius: 50%; background: #C8C8C8; flex: none; }
.dot.on { background: var(--online); }

/* Header rows inside the app (title + one action). */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0 4px; }
.topbar h2 { font-size: 26px; }
.icon-btn {
  background: var(--plum-800); border: 1px solid var(--outline); color: var(--lavender);
  border-radius: 12px; padding: 8px 12px; font-size: 14px; width: auto;
}
.back-btn { background: none; border: none; color: var(--violet-300); font-size: 16px; padding: 8px 0; width: auto; }

/* Lists: chats, contacts, notifications. */
.list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: #FFFFFF;
  border: 1px solid #EFEFEF; border-radius: 18px; padding: 13px 14px; color: var(--lavender);
}
.row:active { transform: scale(.99); }
.avatar {
  width: 48px; height: 48px; border-radius: 50%; flex: none;
  background: var(--accent); color: #191919; font-weight: 700; font-size: 18px;
  display: flex; align-items: center; justify-content: center; position: relative;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar .dot { position: absolute; right: 0; bottom: 2px; border: 2px solid var(--plum-900); }
.row .body { flex: 1; min-width: 0; }
.row .title { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--lavender-muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { text-align: right; flex: none; font-size: 12px; color: var(--lavender-muted); }
.badge {
  display: inline-block; min-width: 22px; padding: 2px 7px; border-radius: 99px;
  background: var(--pink); color: #FFFFFF; font-size: 12px; font-weight: 800; text-align: center; margin-top: 4px;
}
.badge.grey { background: var(--plum-700); color: var(--lavender-muted); }
.empty { text-align: center; color: var(--lavender-muted); padding: 36px 16px; }
.empty .big { font-size: 40px; display: block; margin-bottom: 8px; }

/* Chat view: KakaoTalk bubbles — mine yellow, theirs white. A translated
   message reads like a normal chat message; the original sits underneath
   it as one small grey line, not a boxed-off section. */
#chat-messages { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 8px; }
.msg { max-width: 82%; padding: 10px 13px; border-radius: 18px; font-size: 16px; }
.msg.mine { align-self: flex-end; background: #FEE500; color: #191919; border-bottom-right-radius: 6px; }
.msg.theirs { align-self: flex-start; background: #FFFFFF; border: 1px solid #E5E5E5; color: #191919; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.msg .who { font-size: 12px; font-weight: 700; color: #8A8A8A; margin-bottom: 3px; }
.msg.mine .who { color: #5C5C5C; }
.msg .orig { margin-top: 4px; font-size: 12px; color: #8A8A8A; }
.msg .time { font-size: 11px; opacity: .6; margin-top: 4px; text-align: right; }
.typing { color: var(--lavender-muted); font-size: 13px; font-style: italic; padding: 2px 4px; min-height: 20px; }
.composer {
  display: flex; gap: 8px; padding: 10px 0 calc(4px + env(safe-area-inset-bottom));
  position: sticky; bottom: calc(var(--tab-h) + 8px); background: linear-gradient(180deg, transparent, var(--plum-950) 30%);
}
.composer input { flex: 1; border-radius: 99px; }
.composer button { width: auto; border-radius: 99px; padding: 12px 20px; margin: 0; }

/* Bottom tab bar — thumb friendly, always visible on the main screens. */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: rgba(255,255,255,.97); border-top: 1px solid #E5E5E5;
  padding-bottom: env(safe-area-inset-bottom);
}
#tabs .inner { max-width: 560px; margin: 0 auto; display: flex; height: var(--tab-h); }
.tab {
  flex: 1; background: none; border: none; color: var(--lavender-muted);
  font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  position: relative; padding: 6px 0;
}
.tab .ico { font-size: 22px; line-height: 1; }
.tab.active { color: var(--violet-300); font-weight: 700; }
.tab .tab-badge {
  position: absolute; top: 6px; right: calc(50% - 26px);
  background: var(--pink); color: #FFFFFF; font-size: 11px; font-weight: 800;
  min-width: 18px; height: 18px; border-radius: 99px; display: flex; align-items: center; justify-content: center; padding: 0 5px;
}
#tabs.hidden { display: none; }

/* Auth tabs + small helpers. */
.seg { display: flex; background: #F0F0F0; border-radius: 12px; padding: 4px; margin-top: 16px; }
.seg button { flex: 1; background: none; border: none; color: var(--lavender-muted); padding: 10px; border-radius: 9px; font-weight: 600; }
.seg button.active { background: var(--accent); color: #191919; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.check-row input { width: auto; accent-color: var(--violet-500); }
.notif.unread { border-color: var(--orchid); }
.notif .title { font-weight: 700; }
.notif .sub { color: var(--lavender-muted); font-size: 14px; }
</style>
</head>
<body>
<div id="app">
<main id="main">

  <!-- Every screen is rendered by app.js below into #main, so the page is
       one file of HTML + one file of JS. No build step, no libraries. -->
  <noscript><p style="padding:24px;text-align:center">Multivo needs JavaScript turned on.</p></noscript>
</main>
<nav id="tabs" class="hidden" aria-label="Main sections">
  <div class="inner">
    <button class="tab" data-tab="chats"><span class="ico">💬</span>Chats<span class="tab-badge" id="badge-chats" hidden></span></button>
    <button class="tab" data-tab="contacts"><span class="ico">👥</span>Contacts</button>
    <button class="tab" data-tab="notifications"><span class="ico">🔔</span>Alerts<span class="tab-badge" id="badge-notifs" hidden></span></button>
    <button class="tab" data-tab="profile"><span class="ico">👤</span>Profile</button>
  </div>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
